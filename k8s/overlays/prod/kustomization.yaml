apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Impostato qui, non in base: deve stare allo stesso livello del
# secretGenerator sotto (vedi il commento in overlays/dev per il perché).
namespace: ticker-vault

resources:
  - ../../base

# Placeholder: in un prod reale punterebbe a un registry effettivo e a un tag
# immutabile (release/SHA), non a un'immagine locale. images: sostituisce sia
# nel Deployment sia nel migration Job, che condividono lo stesso nome immagine.
images:
  - name: price-service
    newName: ghcr.io/lorenzoperrella/price-service
    newTag: v0.1.0

# .env.secret separato da dev: credenziali prod non devono mai coincidere con
# quelle di sviluppo locale. Mai committato (vedi .env.secret.example qui accanto).
secretGenerator:
  - name: db-credentials
    envs:
      - .env.secret

patches:
  - target:
      kind: Deployment
      name: price-service
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 2
