name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Ruff check
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: mypy
        run: uv run mypy

  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Run unit tests
        run: uv run pytest tests/unit -v

  integration-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Run integration tests
        run: uv run pytest tests/integration -v

  build-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build image
        run: docker build -t price-service:ci .

      - name: Smoke test image (avvio + /health)
        run: |
          docker run -d --name smoke -p 8000:8000 price-service:ci
          for _ in $(seq 1 20); do
            curl -sf http://localhost:8000/health && break
            sleep 1
          done
          curl -sf http://localhost:8000/health
          docker logs smoke
          docker rm -f smoke

  validate-k8s-manifests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # .env.secret è gitignored: qui basta un file fittizio, kustomize build
      # non tocca un cluster reale né legge i valori a fini di validazione.
      - name: Create dummy .env.secret for kustomize build
        run: |
          for dir in k8s/overlays/dev k8s/overlays/prod; do
            printf 'POSTGRES_USER=ci\nPOSTGRES_PASSWORD=ci\nPOSTGRES_DB=ci\n' > "$dir/.env.secret"
          done

      - name: Validate dev overlay
        run: kubectl kustomize k8s/overlays/dev

      - name: Validate prod overlay
        run: kubectl kustomize k8s/overlays/prod
